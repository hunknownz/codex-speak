[package]
name = "codex-speak"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local Chinese-first speech helper for Codex replies"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
