name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_name: codex-speak-macos
          - os: windows-2022
            artifact_name: codex-speak-windows
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require macOS signing secrets for stable release
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_CODESIGN_IDENTITY \
            MACOS_KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Stable macOS releases require signing and notarization secrets: ${missing[*]}" >&2
            exit 1
          fi
      - name: Require Windows signing secrets for stable release
        if: ${{ runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') }}
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_PFX_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $Missing = @()
          foreach ($Name in @("WINDOWS_SIGN_CERT_PFX_BASE64", "WINDOWS_SIGN_CERT_PASSWORD")) {
            if (-not [Environment]::GetEnvironmentVariable($Name)) {
              $Missing += $Name
            }
          }
          if ($Missing.Count -gt 0) {
            throw "Stable Windows releases require signing secrets: $($Missing -join ', ')"
          }
      - name: Build CLI
        shell: bash
        run: |
          cargo build --release || {
            sleep 10
            cargo build --release
          }
      - name: Build native macOS pet helper
        if: runner.os == 'macOS'
        run: swiftc -O -framework AppKit -framework AVFoundation -o target/release/codex-speak-pet-macos apps/codex-speak-pet-macos/CodexSpeakPet.swift
      - name: Install frontend dependencies
        working-directory: apps/codex-speak-control
        run: npm ci
      - name: Build Tauri app on macOS
        if: runner.os == 'macOS'
        working-directory: apps/codex-speak-control
        run: npm run build -- --bundles app
      - name: Build Tauri app on Windows
        if: runner.os == 'Windows'
        working-directory: apps/codex-speak-control
        run: npm run build -- --no-bundle
      - name: Restore build-time lockfile changes
        if: runner.os == 'Windows'
        shell: bash
        run: git restore -- Cargo.lock apps/codex-speak-control/src-tauri/Cargo.lock
      - name: Check package source tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short
            git diff -- . ':!dist'
            exit 1
          fi
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "Skipping macOS certificate import: MACOS_CERTIFICATE_P12_BASE64 is not set."
            exit 0
          fi
          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-temporary-keychain-password}"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "${MACOS_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" build.keychain
          rm -f certificate.p12
      - name: Package macOS release
        if: runner.os == 'macOS'
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/package-macos-release.sh
      - name: Smoke install macOS release package
        if: runner.os == 'macOS'
        run: scripts/smoke-install-macos-release.sh
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_PFX_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:WINDOWS_SIGN_CERT_PFX_BASE64) {
            $CertPath = Join-Path $env:RUNNER_TEMP "codex-speak-signing.pfx"
            [IO.File]::WriteAllBytes($CertPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_PFX_BASE64))
            $env:WINDOWS_SIGN_CERT_PATH = $CertPath
          }
          .\scripts\package-windows-release.ps1
      - name: Smoke install Windows release package
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\smoke-install-windows-release.ps1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.*

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ contains(github.ref_name, '-rc') }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            dist/codex-speak-macos.tar.gz
            dist/codex-speak-macos.tar.gz.sha256
            dist/codex-speak-windows.zip
            dist/codex-speak-windows.zip.sha256
