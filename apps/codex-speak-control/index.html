<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Speak</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Codex Speak</h1>
          <p id="subtitle">本地朗读控制台</p>
        </div>
        <div class="status-pill" id="health">检查中</div>
      </header>

      <section class="controls" aria-label="主要开关">
        <label class="switch-row">
          <span>
            <strong>自动朗读</strong>
            <small>控制所有朗读播放</small>
          </span>
          <input id="enabled" type="checkbox" />
        </label>

        <label class="switch-row">
          <span>
            <strong>最终导览</strong>
            <small>Codex 回复结束后播放总结</small>
          </span>
          <input id="finalGuideEnabled" type="checkbox" />
        </label>

        <label class="switch-row">
          <span>
            <strong>过程提示</strong>
            <small>长任务中播放少量短提示</small>
          </span>
          <input id="progressPromptsEnabled" type="checkbox" />
        </label>

        <label class="switch-row">
          <span>
            <strong>儿童模式</strong>
            <small>短句、解释代码作用、给下一步</small>
          </span>
          <input id="childMode" type="checkbox" />
        </label>
      </section>

      <section class="panel" aria-label="声音设置">
        <div class="panel-head">
          <h2>朗读引擎</h2>
          <select id="provider" aria-label="朗读引擎">
            <option value="sherpa_melo">MeloTTS 中文女声</option>
            <option value="sherpa_kokoro">Kokoro</option>
            <option value="sherpa_zipvoice">ZipVoice</option>
            <option value="piper">Piper 轻量语音</option>
            <option value="system">系统语音</option>
          </select>
        </div>
        <p id="providerHint" class="hint">-</p>

        <div class="panel-head subhead">
          <h2>声音档位</h2>
          <select id="voiceProfile" aria-label="声音档位">
            <option value="clear_bright">清楚明亮</option>
            <option value="slow_clear">慢一点更清楚</option>
            <option value="quick_preview">快速预览</option>
          </select>
        </div>

        <label class="range-row">
          <span>语速 <output id="speedValue">0.90</output></span>
          <input id="speed" type="range" min="0.6" max="1.3" value="0.9" step="0.01" />
        </label>

        <label class="range-row">
          <span>最多朗读字数 <output id="maxCharsValue">800</output></span>
          <input id="maxChars" type="range" min="120" max="1600" value="800" step="20" />
        </label>
      </section>

      <section class="panel" aria-label="发音词典">
        <div class="panel-head">
          <h2>发音词典</h2>
          <strong id="pronunciationCount">0 条</strong>
        </div>

        <div class="dictionary-form">
          <label>
            <small>原词</small>
            <input id="pronunciationTerm" type="text" autocomplete="off" placeholder="OpenRouter" />
          </label>
          <label>
            <small>读成</small>
            <input id="pronunciationSpoken" type="text" autocomplete="off" placeholder="Open Router 平台" />
          </label>
          <button id="savePronunciation" type="button">保存</button>
        </div>

        <div class="dictionary-preview">
          <input id="pronunciationPreviewText" type="text" autocomplete="off" value="我配置了 OpenRouter。" />
          <button id="previewPronunciation" type="button">预览</button>
        </div>

        <div id="pronunciationList" class="dictionary-list" aria-live="polite"></div>
      </section>

      <section class="actions" aria-label="快捷操作">
        <button id="testSpeak" type="button">试听</button>
        <button id="installModel" type="button">安装模型</button>
        <button id="stopSpeak" type="button">停止</button>
        <button id="refresh" type="button">刷新</button>
        <button id="doctor" type="button">自检</button>
        <button id="supportBundle" type="button">支持包</button>
      </section>

      <section class="panel" aria-label="状态">
        <div class="grid">
          <div>
            <small>引擎</small>
            <strong id="providerState">-</strong>
          </div>
          <div>
            <small>模型</small>
            <strong id="modelState">-</strong>
          </div>
          <div>
            <small>Hook</small>
            <strong id="hookState">-</strong>
          </div>
          <div>
            <small>配置</small>
            <strong id="configState">-</strong>
          </div>
          <div>
            <small>词典</small>
            <strong id="pronunciationState">-</strong>
          </div>
          <div>
            <small>控制台</small>
            <strong id="controlAppState">-</strong>
          </div>
          <div>
            <small>插件</small>
            <strong id="pluginState">-</strong>
          </div>
          <div>
            <small>市场</small>
            <strong id="marketplaceState">-</strong>
          </div>
          <div>
            <small>小伙伴</small>
            <strong id="petState">-</strong>
          </div>
        </div>
      </section>

      <section class="panel last" aria-label="最近朗读">
        <div class="panel-head">
          <h2>最近朗读</h2>
        </div>
        <p id="lastSpoken">暂无记录</p>
      </section>

      <pre id="log" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
